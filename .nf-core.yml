repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - assets/sendmail_template.txt
    - CODE_OF_CONDUCT.md
    - assets/nf-core-fastk_genome_statistics_logo_light.png
    - docs/images/nf-core-fastk_genome_statistics_logo_light.png
    - docs/images/nf-core-fastk_genome_statistics_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config: false
  files_exist:
    - assets/multiqc_config.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-fastk_genome_statistics_logo_light.png
    - docs/images/nf-core-fastk_genome_statistics_logo_light.png
    - docs/images/nf-core-fastk_genome_statistics_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: sanger-tol
  name: fastk_genome_statistics
  description: A small pipeline to fastk and some related statistics tools
  author: DLBPointon
  version: 0.1.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - seqera_platform
    - gpu
    - vscode
  is_nfcore: false
